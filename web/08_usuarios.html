<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Administrar usuarios</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>

<body data-privada="admin">

<div class="sidebar">
    <div class="menu-expandido">

        <div class="perfil">
            <img src="img/iconousuario.png">
            <span class="nombre-usuario">Usuario</span>
        </div>

        <p>REGISTRAR</p>
        <a href="03_agendamiento.html">Agendamiento</a>
        <a href="04_traslado.html">Traslado</a>

        <p>CONSULTAR</p>
        <a href="05_consulta_agendamiento.html">Agendamientos</a>
        <a href="06_consulta_traslado.html">Traslados</a>

        <p>DESCARGAR</p>
        <a href="07_descarga.html">Bases</a>

        <p class="solo-admin" style="display:none">ADMINISTRAR</p>
        <a href="08_usuarios.html" class="solo-admin" style="display:none">Usuarios</a>

        <p>SESIÓN</p>
        <a href="#" class="cerrar-sesion">Cerrar sesión</a>
    </div>
</div>

<div class="contenido">

    <div class="header">
        <div class="titulo">ADMINISTRAR USUARIOS</div>
    </div>

    <form id="formUsuario" class="form-usuario">
        <input type="text" id="nuevoDocumento" placeholder="Número de documento" required>
        <input type="password" id="nuevaPassword" placeholder="Contraseña (mínimo 6 caracteres)" required>
        <input type="password" id="confirmarNuevaPassword" placeholder="Confirmar contraseña" required>
        <select id="nuevoRol">
            <option value="usuario">Usuario</option>
            <option value="admin">Administrador</option>
        </select>
        <button type="submit">Crear usuario</button>
    </form>
    <p id="mensajeUsuario" class="mensaje-usuario"></p>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Documento</th>
                    <th>Rol</th>
                    <th>Fecha de registro</th>
                    <th>Acción</th>
                </tr>
            </thead>

            <tbody id="tablaUsuarios"></tbody>
        </table>
    </div>

</div>

<script src="js/config.js"></script>
<script src="js/script.js"></script>

</body>
</html>
