<body data-privada>

<div class="sidebar">
    <div class="menu-expandido">

        <div class="perfil">
            <img src="img/iconousuario.png">
            <span class="nombre-usuario">Usuario</span>

        <p>CONSULTAR</p>

        <a href="06_consulta_traslado.html">Traslados</a>

        <p>DESCARGAR</p>
        <a href="07_descarga.html">Bases</a>

        <p class="solo-admin" style="display:none">ADMINISTRAR</p>
        <a href="08_usuarios.html" class="solo-admin" style="display:none">Usuarios</a>

        <p>SESIÓN</p>
        <a href="#" class="cerrar-sesion">Cerrar sesión</a>
    </div>
</div>

<div class="contenido">

    <div class="header">
        <div class="titulo">TRASLADO</div>
    </div>

    <div class="iconos">
        <div class="icono-grande">
            <img src="img/iconousuario.png">
        </div>

        <div class="icono-grande">
            <img src="img/iconoruta.png">
        </div>
    </div>

    <div class="formulario">

        <div class="columna">
            <label>Tipo Documento:</label>
            <select id="tipoDocumentoT">
                <option value="">Seleccionar</option>
                <option>CC</option>
                <option>TI</option>
                <option>RC</option>
            </select>

            <label>N° Documento:</label>
            <input type="text" id="documentoT">

            <label>Nombre:</label>
            <input type="text" id="nombreT">

            <label>Apellidos:</label>
            <input type="text" id="apellidosT">
        </div>

        <div class="columna">
            <label>Fecha:</label>
            <input type="date" id="fechaT">

            <label>Hora Origen:</label>
            <input type="time" id="horaOrigen">

            <label>Hora Llegada:</label>
            <input type="time" id="horaLlegada">

            <label>Placa Vehículo:</label>
            <input type="text" id="placa">

            <label>Punto de Origen:</label>
            <select id="origenT">
                <option value="">Seleccionar</option>
                <option>01. USS Simon Bolivar</option>
                <option>03. USS Engativa</option>
                <option>14. CSE Suba</option>
            </select>

            <label>Punto de Destino:</label>
            <select id="destinoT">
                <option value="">Seleccionar</option>
                <option>01. USS Simon Bolivar</option>
                <option>03. USS Engativa</option>
                <option>14. CSE Suba</option>
            </select>
        </div>

    </div>

    <div style="text-align:center; margin-top:30px;">
        <button onclick="guardarTraslado()">Guardar</button>
    </div>

    <p id="mensajeT" style="text-align:center; margin-top:15px; font-weight:bold;"></p>

</div>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
